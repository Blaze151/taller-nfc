<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ficha Digital del Vehículo</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
</head>
<body data-page="client">

<div class="shell">
  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"><img src="assets/logo.png" alt="HGR Automotriz"></div>
      <div>
        <div class="brand-name" id="taller-nombre">HGR Automotriz</div>
      </div>
    </div>
    <span class="eyebrow">Ficha NFC</span>
  </div>

  <div id="content">
    <div class="center-box">
      <span class="spinner"></span>
      <p>Cargando información del vehículo…</p>
    </div>
  </div>

  <div class="footer-note" id="footer-note"></div>
</div>

<div class="lightbox hidden" id="lightbox">
  <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">‹</button>
  <img id="lightbox-img" src="" alt="Foto del servicio ampliada">
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">›</button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
</div>

<script src="assets/app.js"></script>
</body>
</html>
